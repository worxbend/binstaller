<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="binstaller logo">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#151d2b"/>
      <stop offset="1" stop-color="#0b1017"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#tile)" stroke="url(#edge)" stroke-width="4"/>

  <!-- download shaft + head: a binary landing in the bin -->
  <rect x="57" y="26" width="14" height="38" rx="7" fill="url(#arrow)"/>
  <path d="M40 58h48a2 2 0 0 1 1.6 3.2L67.2 89.5a4 4 0 0 1-6.4 0L38.4 61.2A2 2 0 0 1 40 58Z" fill="url(#arrow)"/>

  <!-- tray / bin bracket -->
  <path d="M32 88v10a4 4 0 0 0 4 4h56a4 4 0 0 0 4-4V88" fill="none" stroke="url(#edge)" stroke-width="7" stroke-linecap="round"/>
</svg>
