name: 🚀 Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version or tag, for example v0.1.0"
        required: true
        type: string
      snap-retry-run-id:
        description: "Retry only Snap packaging using native artifacts from this release workflow run ID"
        required: false
        type: string

# Least privilege: each job below declares its own permissions.
permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: 🧱 Build ${{ matrix.target }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
            graalvm-version: "25.5"
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            graalvm-version: "25.5"
          - target: macos-amd64
            runner: macos-15-intel
            # GraalVM 25.0.1 is the last available macOS amd64 release.
            graalvm-java-version: "25.0.1"
          - target: macos-arm64
            runner: macos-15
            graalvm-version: "25.5"

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    if: ${{ !inputs.snap-retry-run-id && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔎 Verify tag points at main
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "❌ Tagged commit ${GITHUB_SHA} is not an ancestor of origin/main" >&2
            exit 1
          fi
          echo "✅ Tag ${GITHUB_REF_NAME} points at a commit on origin/main"

      - name: 🏷️ Resolve release version
        id: version
        uses: ./.github/actions/resolve-version
        with:
          version: ${{ inputs.version }}
          label: "🏷️ Building release {version} for ${{ matrix.target }}"

      - name: 🔎 Verify existing tag points at this commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          # A release for an existing tag stays at the tag's commit whatever target is passed when
          # publishing, so binaries built from another commit would ship under a tag they do not match.
          tag_sha="$(bash .github/scripts/tag-commit.sh "${RELEASE_VERSION}")"
          if [[ -z "${tag_sha}" ]]; then
            echo "✅ Tag ${RELEASE_VERSION} does not exist yet"
            exit 0
          fi
          if [[ "${tag_sha}" != "${GITHUB_SHA}" ]]; then
            echo "❌ Tag ${RELEASE_VERSION} points at ${tag_sha}, but this run builds ${GITHUB_SHA}" >&2
            echo "Re-run the release run of the tag push to build the tagged commit, or publish a new patch tag." >&2
            exit 1
          fi
          echo "✅ Tag ${RELEASE_VERSION} points at ${GITHUB_SHA}"

      - name: ⚡ Cache Mill and dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/coursier
            ~/Library/Caches/Coursier
            ~/.cache/mill
            ~/.ivy2/cache
          # Separate from the Checks workflow cache on purpose: a build that is signed and published
          # must not restore dependencies saved by a Checks run.
          key: release-${{ runner.os }}-${{ runner.arch }}-mill-${{ hashFiles('build.mill', 'mill', '.mill-version') }}
          restore-keys: |
            release-${{ runner.os }}-${{ runner.arch }}-mill-

      - name: ☕ Set up GraalVM
        uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          distribution: graalvm
          version: ${{ matrix.graalvm-version }}
          java-version: ${{ matrix.graalvm-java-version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: ☕ Print toolchain versions
        shell: bash
        run: |
          java -version
          native-image --version

      - name: ✅ Compile and test
        shell: bash
        run: |
          echo "::group::🧪 Compile"
          ./mill __.compile
          echo "::endgroup::"
          echo "::group::🧫 Test"
          ./mill __.test
          echo "::endgroup::"

      - name: 🔥 Build GraalVM native CLI image
        id: native-image
        shell: bash
        env:
          # Baked into the binary as the `--version` output.
          BINSTALLER_VERSION: ${{ steps.version.outputs.number }}
        run: |
          echo "::group::🔥 GraalVM native CLI image"
          echo "🔥 Building CLI app with Mill target app.nativeImage"
          native_ref="$(./mill show app.nativeImage | sed -n 's/^"\(.*\)"$/\1/p' | tail -n 1)"
          image_path="${native_ref#ref:v0:*:}"
          if [[ "${image_path}" == "${native_ref}" && ! -f "${image_path}" ]]; then
            image_path="${native_ref}"
          fi

          if [[ -z "${image_path}" || ! -f "${image_path}" ]]; then
            echo "❌ Native image was not produced at expected path: ${image_path}" >&2
            exit 1
          fi

          echo "✅ GraalVM native CLI image ready: ${image_path}"
          echo "path=${image_path}" >> "${GITHUB_OUTPUT}"
          echo "::endgroup::"

      - name: 📦 Package native CLI artifact
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          target="${{ matrix.target }}"
          package_root="dist/binstaller-${version}-${target}"
          archive="binstaller-${version}-${target}.tar.gz"

          echo "::group::📦 Package ${archive}"
          mkdir -p "${package_root}"
          cp "${{ steps.native-image.outputs.path }}" "${package_root}/binstaller"
          chmod +x "${package_root}/binstaller"

          echo "::group::🧪 Native CLI smoke test"
          "${package_root}/binstaller" --help >/tmp/binstaller-help.txt
          echo "✅ Native CLI starts and renders help"
          reported_version="$("${package_root}/binstaller" --version)"
          if [[ "${reported_version}" != "binstaller ${version#v}" ]]; then
            echo "❌ Native CLI reports '${reported_version}', expected 'binstaller ${version#v}'" >&2
            exit 1
          fi
          echo "✅ Native CLI reports ${reported_version}"
          # Forced color initializes the dependency lazy vals that reach sun.misc.Unsafe. TERM is set
          # because TERM=dumb or NO_COLOR would win over FORCE_COLOR and skip that code path.
          env -u NO_COLOR TERM=xterm FORCE_COLOR=1 "${package_root}/binstaller" --help \
            >/dev/null 2>/tmp/binstaller-help-stderr.txt
          if [[ -s /tmp/binstaller-help-stderr.txt ]]; then
            echo "❌ Native CLI help writes to stderr:" >&2
            cat /tmp/binstaller-help-stderr.txt >&2
            exit 1
          fi
          echo "✅ Native CLI help prints no JDK warnings"
          "${package_root}/binstaller" plan --config config.example.yaml >/tmp/binstaller-plan.txt
          echo "✅ Native CLI runs plan"
          "${package_root}/binstaller" versions --config config.example.yaml >/tmp/binstaller-versions.txt
          echo "✅ Native CLI runs versions"
          # apply and lock run without the network: the only tool of a temporary manifest is skipped,
          # so nothing is downloaded, and every file stays under the runner temp directory.
          native_cli="${PWD}/${package_root}/binstaller"
          smoke_dir="${RUNNER_TEMP}/binstaller-smoke"
          mkdir -p "${smoke_dir}"
          cat > "${smoke_dir}/smoke.yaml" <<MANIFEST
          apiVersion: binstaller.io/v1alpha1
          kind: BinaryDistributionProfile
          metadata:
            name: release-smoke
          spec:
            policy:
              appsDir: "${smoke_dir}/apps"
            versions:
              smoke: "1.0.0"
            plan:
              - name: smoke
                kind: binary-tool
                spec:
                  versionRef: smoke
                  installDir: "${smoke_dir}/apps/smoke"
                  download:
                    url: https://example.invalid/smoke
                    filename: smoke
                  executables:
                    - path: bin/smoke
          MANIFEST
          (
            cd "${smoke_dir}" || exit 1
            "${native_cli}" apply --config smoke.yaml --skip smoke --parallelism 1 >apply.txt
            echo "✅ Native CLI runs apply"
            # The same command with a bad value must fail as a usage error, which shows the option
            # value reaches its validation.
            usage_status=0
            "${native_cli}" apply --config smoke.yaml --skip smoke --parallelism 0 || usage_status=$?
            if [[ "${usage_status}" != 2 ]]; then
              echo "❌ Native CLI apply --parallelism 0 exits with ${usage_status}, expected usage error 2" >&2
              exit 1
            fi
            echo "✅ Native CLI apply rejects --parallelism 0"
            "${native_cli}" lock --config smoke.yaml --skip smoke --lock-file binstaller.lock.json >lock.txt
            if [[ ! -s binstaller.lock.json ]]; then
              echo "❌ Native CLI lock wrote no lock file" >&2
              exit 1
            fi
            echo "✅ Native CLI runs lock"
          )
          echo "::endgroup::"

          tar -C dist -czf "${archive}" "binstaller-${version}-${target}"
          shasum -a 256 "${archive}" > "${archive}.sha256"
          echo "✅ Artifact ready: ${archive}"
          echo "🔐 Checksum ready: ${archive}.sha256"
          echo "::endgroup::"

      - name: ⬆️ Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binstaller-${{ steps.version.outputs.value }}-${{ matrix.target }}
          path: |
            binstaller-${{ steps.version.outputs.value }}-${{ matrix.target }}.tar.gz
            binstaller-${{ steps.version.outputs.value }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: 🚢 Publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
    needs:
      - build

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏷️ Resolve release version
        id: version
        uses: ./.github/actions/resolve-version
        with:
          version: ${{ inputs.version }}
          label: "🚢 Preparing release {version}"

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts
          pattern: binstaller-${{ steps.version.outputs.value }}-*
          merge-multiple: true

      - name: 🧰 Add example config
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          example="release-artifacts/config.example.${version}.yaml"

          echo "::group::🧰 Example config"
          cp config.example.yaml "${example}"
          (cd release-artifacts && shasum -a 256 "config.example.${version}.yaml" > "config.example.${version}.yaml.sha256")
          echo "✅ Example config ready: ${example}"
          echo "🔐 Checksum ready: ${example}.sha256"
          echo "::endgroup::"

      - name: 🧰 Add install script
        shell: bash
        run: |
          echo "::group::🧰 Install script"
          cp scripts/install.sh release-artifacts/install.sh
          chmod +x release-artifacts/install.sh
          echo "✅ Install script ready: release-artifacts/install.sh"
          echo "::endgroup::"

      - name: 🔎 Verify release artifacts
        shell: bash
        run: |
          echo "::group::🔎 Artifact inventory"
          mapfile -t archives < <(find release-artifacts -type f -name '*.tar.gz' | sort)
          printf '📦 %s\n' "${archives[@]}"
          echo "::endgroup::"

          if [[ "${#archives[@]}" -lt 1 ]]; then
            echo "❌ No build artifacts found for ${{ steps.version.outputs.value }}" >&2
            exit 1
          fi

          example="release-artifacts/config.example.${{ steps.version.outputs.value }}.yaml"
          if [[ ! -f "${example}" || ! -f "${example}.sha256" ]]; then
            echo "❌ Missing example config or checksum" >&2
            exit 1
          fi
          echo "✅ Example config"

          if [[ ! -f release-artifacts/install.sh ]]; then
            echo "❌ Missing install script" >&2
            exit 1
          fi
          echo "✅ Install script"

          echo "::group::🧾 Required target check"
          expected_targets=(linux-amd64 linux-arm64 macos-amd64 macos-arm64)
          for target in "${expected_targets[@]}"; do
            archive="release-artifacts/binstaller-${{ steps.version.outputs.value }}-${target}.tar.gz"
            checksum="${archive}.sha256"
            if [[ ! -f "${archive}" || ! -f "${checksum}" ]]; then
              echo "❌ Missing release artifact or checksum for ${target}" >&2
              exit 1
            fi
            echo "✅ ${target}"
          done
          echo "::endgroup::"

          echo "::group::🔐 Checksum verification"
          (cd release-artifacts && shasum -a 256 -c ./*.sha256)
          echo "::endgroup::"

      - name: 🔏 Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v3.1.4"

      - name: 🔏 Sign release artifacts with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' artifact; do
            cosign sign-blob --yes \
              --bundle "${artifact}.sigstore.json" \
              "${artifact}"
          done < <(find release-artifacts -maxdepth 1 -type f ! -name '*.sigstore.json' -print0)

      - name: 🚀 Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          notes=$'🚀 Automated binstaller release for '"${version}"$'.\n\nInstall on Linux:\n\n```\ncurl --proto \'=https\' --tlsv1.2 -sSfL https://github.com/'"${GITHUB_REPOSITORY}"$'/releases/latest/download/install.sh | sh\n```\n\nArtifacts:\n- 🐧 Linux amd64 GraalVM native CLI\n- 🐧 Linux arm64 GraalVM native CLI\n- 🍎 macOS amd64 GraalVM native CLI\n- 🍎 macOS arm64 GraalVM native CLI\n- 🧰 Example configuration\n- 📜 install.sh\n\nEach release asset includes a SHA-256 checksum where applicable and a keyless Sigstore bundle tied to this GitHub Actions workflow identity.'

          if gh release view "${version}" >/dev/null 2>&1; then
            if [[ "$(gh release view "${version}" --json isDraft --jq '.isDraft')" == "true" ]]; then
              echo "♻️ Updating existing draft release ${version}"
              gh release upload "${version}" release-artifacts/* --clobber
            else
              echo "❌ Release ${version} is already published; refusing to replace its assets" >&2
              echo "Publish a new patch tag instead, or delete the release and re-run this workflow." >&2
              exit 1
            fi
          else
            # The tag can appear after the build job looked for it. gh leaves an existing tag where
            # it is, so creating the release now would publish these binaries under another commit.
            tag_sha="$(bash .github/scripts/tag-commit.sh "${version}")"
            if [[ -n "${tag_sha}" && "${tag_sha}" != "${GITHUB_SHA}" ]]; then
              echo "❌ Tag ${version} points at ${tag_sha}, but these artifacts were built from ${GITHUB_SHA}" >&2
              exit 1
            fi
            echo "🚀 Creating release ${version}"
            gh release create "${version}" release-artifacts/* \
              --target "${GITHUB_SHA}" \
              --title "${version}" \
              --notes "${notes}"
          fi
          echo "🎉 Release ${version} is published"

  snap:
    name: 📦 Snap ${{ matrix.arch }}
    if: ${{ always() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.snap-retry-run-id != '' && github.ref == 'refs/heads/main')) }}
    permissions:
      contents: read
      actions: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    environment: release
    needs:
      - release
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: linux-amd64
            runner: ubuntu-26.04
          - arch: arm64
            target: linux-arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏷️ Resolve release version
        id: version
        uses: ./.github/actions/resolve-version
        with:
          version: ${{ inputs.version }}
          label: "🏷️ Building snap {version} for ${{ matrix.arch }}"

      - name: 🔎 Verify retry artifact source
        if: ${{ inputs.snap-retry-run-id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETRY_RUN_ID: ${{ inputs.snap-retry-run-id }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          [[ "${RETRY_RUN_ID}" =~ ^[0-9]+$ ]] || { echo "Invalid retry run ID" >&2; exit 1; }
          expected_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_VERSION}" --jq '.sha')"
          source="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RETRY_RUN_ID}" --jq '[.path, .head_sha] | @tsv')"
          IFS=$'\t' read -r workflow_path source_sha <<< "${source}"
          if [[ "${workflow_path}" != ".github/workflows/release.yml" || "${source_sha}" != "${expected_sha}" ]]; then
            echo "Retry artifacts must come from the release workflow at the tagged commit" >&2
            exit 1
          fi

      - name: 📥 Download native CLI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binstaller-${{ steps.version.outputs.value }}-${{ matrix.target }}
          path: release-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.snap-retry-run-id || github.run_id }}

      - name: 📦 Stage snap payload
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          target="${{ matrix.target }}"
          archive="release-artifacts/binstaller-${version}-${target}.tar.gz"

          echo "::group::📦 Extract ${archive}"
          (cd release-artifacts && sha256sum --check "binstaller-${version}-${target}.tar.gz.sha256")
          mkdir -p snap-stage
          tar -xzf "${archive}" -C snap-stage --strip-components=1 "binstaller-${version}-${target}/binstaller"
          chmod +x snap-stage/binstaller
          echo "::endgroup::"

      - name: 🏷️ Set snap version
        shell: bash
        env:
          SNAP_VERSION: ${{ steps.version.outputs.number }}
        run: |
          sed -i "s/^version: .*/version: \"${SNAP_VERSION}\"/" snap/snapcraft.yaml

      - name: 🛠️ Install snapcraft
        shell: bash
        run: |
          sudo snap install snapcraft --classic --channel=9.x/stable
          sudo snap install core26 --channel=latest/stable

      - name: 🔥 Build classic snap
        shell: bash
        run: snapcraft pack --destructive-mode --verbosity=verbose

      - name: 🔎 Locate built snap
        id: snap-file
        shell: bash
        run: |
          snap_file="$(find . -maxdepth 1 -name '*.snap' | head -n 1)"
          if [[ -z "${snap_file}" ]]; then
            echo "❌ No .snap file was produced" >&2
            exit 1
          fi
          echo "✅ Built ${snap_file}"
          echo "path=${snap_file}" >> "${GITHUB_OUTPUT}"

      - name: 🧪 Smoke test built snap
        shell: bash
        run: |
          sudo snap install --dangerous --classic "${{ steps.snap-file.outputs.path }}"
          binstaller --help
          sudo snap remove binstaller

      - name: ⬆️ Upload snap artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binstaller-${{ steps.version.outputs.value }}-snap-${{ matrix.arch }}
          path: ${{ steps.snap-file.outputs.path }}
          if-no-files-found: error

      - name: 🚀 Publish to Snap Store (stable, classic)
        if: ${{ env.SNAPCRAFT_STORE_CREDENTIALS != '' }}
        shell: bash
        run: snapcraft upload "${{ steps.snap-file.outputs.path }}" --release=stable

      - name: ⏭️ Record Snap Store publish skip
        if: ${{ env.SNAPCRAFT_STORE_CREDENTIALS == '' }}
        shell: bash
        run: |
          echo "::notice::SNAPCRAFT_STORE_CREDENTIALS is not set; skipping Snap Store upload for ${{ steps.snap-file.outputs.path }}"
          echo "📦 Snap Store publish skipped: \`SNAPCRAFT_STORE_CREDENTIALS\` is not set (${{ steps.snap-file.outputs.path }})." >> "${GITHUB_STEP_SUMMARY}"
