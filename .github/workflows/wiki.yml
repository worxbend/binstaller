name: Wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish wiki/ to the GitHub wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          if ! git ls-remote "$remote" >/dev/null 2>&1; then
            echo "::error::The wiki repository does not exist yet."
            echo "Create the first page once at https://github.com/${GITHUB_REPOSITORY}/wiki," \
                 "then re-run this workflow."
            exit 1
          fi

          git clone --depth 1 "$remote" wiki-repo
          find wiki-repo -mindepth 1 -maxdepth 1 -name '.git' -prune -o -exec rm -rf {} +
          cp wiki/*.md wiki-repo/

          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "docs: sync wiki from ${GITHUB_SHA}"
          git push origin HEAD
