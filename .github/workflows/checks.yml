name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }} / JDK ${{ matrix.java }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
        java: ["21", "27"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          check-latest: true

      - name: Cache Mill and dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/coursier
            ~/Library/Caches/Coursier
            ~/.cache/mill
            ~/.ivy2/cache
          key: ${{ runner.os }}-${{ runner.arch }}-mill-${{ hashFiles('build.mill', 'mill', '.mill-version') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mill-

      - name: Check formatting
        run: ./mill mill.scalalib.scalafmt/checkFormatAll

      - name: Check patch whitespace
        run: git diff --check

      - name: Compile with warnings as errors
        run: ./mill __.compile

      - name: Run tests
        run: ./mill __.test

      - name: Smoke test CLI
        run: ./mill app.run --help
