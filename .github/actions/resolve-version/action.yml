name: Resolve release version
description: Resolves and validates the release version from the pushed tag or the workflow_dispatch input.

inputs:
  version:
    description: "workflow_dispatch version input (ignored for tag pushes)"
    required: false
    default: ""
  label:
    description: "Log message template; {version} is replaced with the resolved version"
    required: false
    default: "🏷️ Resolved release {version}"

outputs:
  value:
    description: "Resolved release version, for example v0.1.0"
    value: ${{ steps.resolve.outputs.value }}
  number:
    description: "Resolved release version without the leading v"
    value: ${{ steps.resolve.outputs.number }}

runs:
  using: composite
  steps:
    - name: 🏷️ Resolve release version
      id: resolve
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        LABEL: ${{ inputs.label }}
      run: |
        if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
          version="${INPUT_VERSION}"
        else
          version="${GITHUB_REF_NAME}"
        fi

        if [[ -z "${version}" ]]; then
          echo "❌ Release version is empty" >&2
          exit 1
        fi

        if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
          echo "❌ Invalid release version: ${version}" >&2
          exit 1
        fi

        echo "${LABEL//\{version\}/${version}}"
        echo "value=${version}" >> "${GITHUB_OUTPUT}"
        echo "number=${version#v}" >> "${GITHUB_OUTPUT}"
